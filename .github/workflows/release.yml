name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const v = process.env.PACKAGE_VERSION;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${v}`,
              name: `LutraCredentials v${v}`,
              body: `## 🎉 v2.0.0 更新日志 / What's New

            ### ✨ 新增
            - **新平台支持**：Cursor、Windsurf、CodeBuddy、WorkBuddy、Qoder、Trae 本地账号一键导入与切换
            - **官方 OAuth 登录**：Claude / Codex 订阅账号直接授权导入
            - **本地路由代理**：HTTP 代理 + 上游故障转移 + 竞速 / 最低延迟聚合模式
            - **AI 用量统计**：请求量、Token 消耗、缓存命中、成本估算与 14 天趋势
            - **API 端点测速**：供应商选择时实时比较延迟
            - **数据安全**：备份恢复、运行日志查看、凭据自动刷新
            - **「数据与路径」页面**：集中管理数据存储、备份、日志与本地平台路径
            - **版本号菜单**：右上角版本号可点击，快速检查更新
            - **更新日志看板**：每次更新后可查看具体变更内容

            ### 🎨 改进
            - 全新「岩灰湖绿」视觉设计，支持浅色 / 深色主题
            - 项目品牌正式更名为 LutraCredentials
            - 平台账号操作统一契约，架构解耦，扩展新平台更简单

            ### 🔧 修复
            - 自动刷新按间隔动态计算令牌过期提前量，启动时立即检查
            - Windows 控制台非 UTF-8 编码输出乱码
            - OAuth 数据序列化命名不一致导致的导入失败

            ---

            ## 📦 下载说明 / Download Guide

            ### Windows
            - **Windows 10/11 (64-bit)**: 下载 \`.msi\` 或 \`.exe\` 文件
              - \`LutraCredentials_${v}_x64_en-US.msi\` - MSI 安装包（推荐）
              - \`LutraCredentials_${v}_x64-setup.exe\` - EXE 安装包

            ### macOS
            - **Apple Silicon (M1/M2/M3)**: 下载 \`aarch64\` 版本
              - \`LutraCredentials_${v}_aarch64.dmg\`
            - **Intel 芯片**: 下载 \`x64\` 版本
              - \`LutraCredentials_${v}_x64.dmg\`

            ### Linux
            - **Debian/Ubuntu**: 下载 \`.deb\` 文件
              - \`lutracredentials_${v}_amd64.deb\`
            - **其他发行版**: 下载 \`.AppImage\` 文件
              - \`LutraCredentials_${v}_amd64.AppImage\`

            ---

            ## 🔍 如何确定你的系统架构？

            ### macOS
            打开终端运行：
            \`\`\`bash
            uname -m
            \`\`\`
            - 输出 \`arm64\` → 下载 aarch64 版本
            - 输出 \`x86_64\` → 下载 x64 版本

            ### Windows
            - 设置 → 系统 → 关于 → 系统类型
            - 显示 "基于 x64 的处理器" → 下载 x64 版本

            ### Linux
            终端运行：
            \`\`\`bash
            uname -m
            \`\`\`
            - 输出 \`x86_64\` → 下载 amd64 版本`,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          tauriScript: npm run tauri

